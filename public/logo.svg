<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GameDeals">
  <defs>
    <linearGradient id="plateGradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfaff" />
      <stop offset="1" stop-color="#e9e5f6" />
    </linearGradient>
    <linearGradient id="padGradient" x1="10" y1="13" x2="54" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a78bfa" />
      <stop offset="0.55" stop-color="#7c3aed" />
      <stop offset="1" stop-color="#5b21b6" />
    </linearGradient>
    <linearGradient id="padSheen" x1="32" y1="13" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="padShade" x1="32" y1="34" x2="32" y2="49" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e0b45" stop-opacity="0" />
      <stop offset="1" stop-color="#1e0b45" stop-opacity="0.35" />
    </linearGradient>
    <filter id="padShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="2.4" stdDeviation="2.6" flood-color="#2a0f5e" flood-opacity="0.38" />
    </filter>
    <path
      id="padBody"
      d="M21 15H43C46.6 15 49.9 17.1 51.4 20.4L57.2 32.6C59.6 37.7 57.4 43.7 52.4 46.1C47.9 48.2 42.6 46.6 39.9 42.5L37.9 39.4C36.7 37.6 34.7 36.5 32.5 36.5C30.3 36.5 28.3 37.6 27.1 39.4L25.1 42.5C22.4 46.6 17.1 48.2 12.6 46.1C7.6 43.7 5.4 37.7 7.8 32.6L13.6 20.4C15.1 17.1 18.4 15 21 15Z"
    />
  </defs>

  <rect id="plate" x="0" y="0" width="64" height="64" rx="14" fill="url(#plateGradient)" />
  <rect
    id="plateEdge"
    x="0.5"
    y="0.5"
    width="63"
    height="63"
    rx="13.5"
    fill="none"
    stroke="#000000"
    stroke-opacity="0.06"
  />

  <ellipse cx="32" cy="33" rx="19" ry="13" fill="#7c3aed" opacity="0.09" />

  <g id="pad" filter="url(#padShadow)">
    <use
      href="#padBody"
      fill="url(#padGradient)"
      stroke="#ffffff"
      stroke-opacity="0.12"
      stroke-width="0.75"
    />
    <use href="#padBody" fill="url(#padSheen)" />
    <use href="#padBody" fill="url(#padShade)" />

    <g id="padDetails">
      <rect x="16" y="25.4" width="13" height="4.2" rx="2.1" fill="#ffffff" opacity="0.95" />
      <rect x="20.4" y="21" width="4.2" height="13" rx="2.1" fill="#ffffff" opacity="0.95" />

      <circle cx="44.5" cy="21.6" r="2.7" fill="#fce100" />
      <circle cx="38.6" cy="27.5" r="2.7" fill="#479ef5" />
      <circle cx="50.4" cy="27.5" r="2.7" fill="#e74856" />
      <circle cx="44.5" cy="33.4" r="2.7" fill="#6ccb5f" />

      <rect x="29.6" y="18.6" width="5" height="2.6" rx="1.3" fill="#ffffff" opacity="0.55" />
    </g>
  </g>
</svg>
